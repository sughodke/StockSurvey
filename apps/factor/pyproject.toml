[project]
name = "factor"
version = "0.1.0"
requires-python = ">=3.10"
description = "Cross-sectional rank-IC scorer: pretrained CWT backbone or deterministic indicator stack."
dependencies = [
    "ss-features",
    "ss-loaders",
    "ss-indicators",
    "ss-tg-ops",
    "numpy",
    "pandas",
    "matplotlib",
    "tinygrad>=0.10.0",
    "tqdm",
]

[project.optional-dependencies]
# `uvx modal run apps/factor/scripts/modal/train_indicator.py` is the
# canonical invocation — uvx pulls modal into its own ephemeral env and
# sidesteps the Intel-macOS Python 3.13 wheel gap on cbor2 (modal's
# transitive C dep). Listed here as an extra so the workspace dependency
# graph documents the requirement; not installed by default.
modal = ["modal>=0.60"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/factor"]
