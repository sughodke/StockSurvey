[project]
name = "ss-docs"
version = "0.1.0"
requires-python = ">=3.10"
description = "StockSurvey documentation site (Material for MkDocs)."
dependencies = [
    "mkdocs-material>=9.5",
]

[project.scripts]
ss-docs-serve = "ss_docs.cli:serve"
ss-docs-build = "ss_docs.cli:build"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ss_docs"]
