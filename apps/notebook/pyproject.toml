[project]
name = "stocksurvey-notebook"
version = "0.1.0"
requires-python = ">=3.10"
description = "Research notebooks: CWT vision multi-head, scalogram experiments."
dependencies = [
    "ss-loaders",
    "ss-indicators",
    "ss-wavelets",
    "ss-portfolio",
    "ss-plotting",
    "numpy",
    "pandas",
    "matplotlib",
    "jax<0.5",
    "jaxlib<0.5",
    "optax>=0.2.5",
    "flax",
    "jupyter",
    "imageio-ffmpeg>=0.6.0",
]

[project.scripts]
ss-scalogram = "ss_notebook.scalogram:main"
ss-scalogram-video = "ss_notebook.scalogram_video:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ss_notebook"]
