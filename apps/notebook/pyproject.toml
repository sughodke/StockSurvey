[project]
name = "stocksurvey-notebook"
version = "0.1.0"
requires-python = ">=3.10"
description = "Jupyter playground + scalogram visualizers (`ss-scalogram`, `ss-scalogram-video`). The CNN trainer was extracted to apps/replay; the factor scorer to apps/factor."
dependencies = [
    "ss-cli",
    "ss-features",
    "ss-loaders",
    "ss-indicators",
    "ss-wavelets",
    "ss-plotting",
    "numpy",
    "pandas",
    "matplotlib",
    "jupyter",
    "imageio-ffmpeg>=0.6.0",
]

[project.scripts]
ss-scalogram = "ss_notebook.scalogram:main"
ss-scalogram-video = "ss_notebook.scalogram_video:main"
ss-kalman-cwt = "ss_notebook.kalman_cwt:main"
ss-rnn-cwt = "ss_notebook.rnn_cwt:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ss_notebook"]
