[project]
name = "lie"
version = "0.1.0"
requires-python = ">=3.10"
description = "Lie-group / hierarchical-network strategies: HRP allocator + correlation-spectrum effective-rank as a symmetry-breaking regime signal."
dependencies = [
    "ss-loaders",
    "ss-indicators",
    "ss-portfolio",
    "ss-wavelets",
    "numpy",
    "pandas",
    "scipy",
]

[project.optional-dependencies]
research = [
    "matplotlib",
]

[project.scripts]
ss-lie = "lie.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lie"]
