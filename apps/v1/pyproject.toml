[project]
name = "v1"
version = "0.1.0"
requires-python = ">=3.10"
description = "Legacy single-ticker workflow: Security/Span/Decider/Evaluator + aiohttp web service."
dependencies = [
    "numpy",
    "pandas",
    "scipy",
    "scikit-learn",
    "matplotlib",
    "joblib",
    "requests",
    "yfinance",
    "aiohttp",
    "aiohttp-swagger",
    "tqdm",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/v1"]
