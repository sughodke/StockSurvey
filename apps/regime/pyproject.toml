[project]
name = "regime"
version = "0.1.0"
requires-python = ">=3.10"
description = "Differentiable CWT-regime portfolio strategy: train, backtest, trade live."
dependencies = [
    "ss-loaders",
    "ss-indicators",
    "ss-wavelets",
    "ss-portfolio",
    "ss-plotting",
    "numpy",
    "pandas",
    "jax<0.5",
    "jaxlib<0.5",
    "optax>=0.2.5",
    "tqdm",
    "matplotlib",
    "alpaca-py>=0.30",
]

[project.optional-dependencies]
research = [
    "bt",
    "optuna",
]

[project.scripts]
regime = "regime.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/regime"]
