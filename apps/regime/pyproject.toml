[project]
name = "regime"
version = "0.1.0"
requires-python = ">=3.10"
description = "Differentiable CWT-regime portfolio strategy: train, backtest, trade live."
dependencies = [
    "ss-cli",
    "ss-loaders",
    "ss-features",
    "ss-indicators",
    "ss-wavelets",
    "ss-portfolio",
    "ss-plotting",
    "numpy",
    "pandas",
    "jax<0.5",
    "jaxlib<0.5",
    "optax>=0.2.5",
    "tqdm",
    "matplotlib",
    "alpaca-py>=0.30",
]

[project.optional-dependencies]
research = [
    "bt",
    "optuna",
    # vectorbt is the fast vectorized backtester. Pin to 1.0.x; uv's
    # dependency-metadata override in the root pyproject strips numba
    # from its requirements (numba comes from the nix devShell — see
    # README.md "Nix dev shell" section).
    "vectorbt>=1.0,<2.0",
]

[project.scripts]
regime = "regime.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/regime"]
