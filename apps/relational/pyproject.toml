[project]
name = "relational"
version = "0.1.0"
requires-python = ">=3.10"
description = "Relational CWT research: stock-minus-sector excess divergence + cross-sectional dispersion / correlation / coherence."
dependencies = [
    "ss-loaders",
    "ss-wavelets",
    "ss-indicators",
    "ss-portfolio[alpaca]",
    "ss-plotting",
    "numpy",
    "pandas",
    "matplotlib",
]

[project.optional-dependencies]
research = [
    "bt",
    "optuna",
    "vectorbt>=1.0,<2.0",
]

[project.scripts]
ss-relational = "relational.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/relational"]
