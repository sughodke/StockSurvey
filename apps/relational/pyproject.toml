[project]
name = "relational"
version = "0.1.0"
requires-python = ">=3.10"
description = "Relational CWT research: stock-minus-sector excess divergence + cross-sectional dispersion / correlation / coherence."
dependencies = [
    "ss-loaders",
    "ss-wavelets",
    "ss-indicators",
    "ss-portfolio[alpaca]",
    "ss-plotting",
    "ss-features",        # Compression (2D DWT keep-LL) for fingerprint dim-reduction.
    "numpy",
    "pandas",
    "matplotlib",
    # Direct deps for empirical_sectors{,_gmm}.py + cluster_tracking.py.
    # Were transitively present via regime[research]; declared explicitly
    # so a clean `relational`-only install doesn't ImportError. (review #8)
    "scikit-learn",
    "scipy",
]

[project.optional-dependencies]
research = [
    "bt",
    "optuna",
    "vectorbt>=1.0,<2.0",
]

[project.scripts]
ss-relational = "relational.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/relational"]
