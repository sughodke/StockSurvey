[project]
name = "replay"
version = "0.1.0"
requires-python = ">=3.10"
description = "Multi-head CNN trainer that reconstructs technical indicators (RSI/MACD/vol/CCI/price) from causal CWT slices, with FiLM conditioning over (n, w) parameter grids. Produces backbone npz artifacts consumed by `apps/factor` for cross-sectional rank-IC scoring."
dependencies = [
    "ss-features",
    "ss-indicators",
    "ss-wavelets",
    "ss-loaders",
    "ss-tg-ops",
    "ss-tinygrad",
    "numpy",
    "pandas",
    "matplotlib",
    "scipy",
    "tinygrad>=0.10.0",
    "tqdm",
]

[project.optional-dependencies]
optuna = [
    "optuna",
]

[project.scripts]
ss-replay = "replay:main"
ss-replay-optuna = "replay.optuna_search:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/replay"]

[tool.uv.sources]
ss-tinygrad = { workspace = true }
