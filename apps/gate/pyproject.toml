[project]
name = "gate"
version = "0.1.0"
requires-python = ">=3.10"
description = "Aggregate drawdown forecaster — regime gate that scales EW exposure based on predicted forward drawdown."
dependencies = [
    "ss-loaders",
    "ss-portfolio",
    "numpy",
    "pandas",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gate"]

[project.scripts]
ss-gate = "gate.cli:main"

[tool.uv.sources]
ss-loaders = { workspace = true }
ss-portfolio = { workspace = true }
