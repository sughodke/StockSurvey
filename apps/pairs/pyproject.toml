[project]
name = "pairs"
version = "0.1.0"
requires-python = ">=3.10"
description = "Pair-spread mean reversion — Engle-Granger cointegration screening + dollar-neutral pair trading."
dependencies = [
    "ss-loaders",
    "ss-portfolio",
    "ss-indicators",
    "numpy",
    "pandas",
    "scipy",
    "statsmodels",
    "tqdm",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pairs"]

[project.scripts]
ss-pairs = "pairs.cli:main"

[tool.uv.sources]
ss-loaders = { workspace = true }
ss-portfolio = { workspace = true }
ss-indicators = { workspace = true }
