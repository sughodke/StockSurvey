[project]
name = "cfr"
version = "0.1.0"
requires-python = ">=3.10"
description = "Deep CFR meta-allocator across the existing strategy menu. Tabular CFR over (infoset, action) at Phase 1; Deep CFR over a multi-modal encoder at Phase 2+."
dependencies = [
    "ss-loaders",
    "ss-portfolio",
    "ss-indicators",
    "ss-macro",
    "numpy",
    "pandas",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cfr"]

[project.scripts]
ss-cfr = "cfr.cli:main"

[tool.uv.sources]
ss-loaders = { workspace = true }
ss-portfolio = { workspace = true }
ss-indicators = { workspace = true }
ss-macro = { workspace = true }
