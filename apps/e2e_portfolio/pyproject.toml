[project]
name = "e2e-portfolio"
version = "0.1.0"
requires-python = ">=3.10"
description = "End-to-end DL portfolio allocator (Zhang-Zohren-Roberts) on Phase 4d ETF basket, direct-Sharpe optimized in tinygrad."
dependencies = [
    "ss-indicators",
    "ss-macro",
    "ss-portfolio",
    "ss-loaders",
    "numpy",
    "pandas",
    "tinygrad",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/e2e_portfolio"]

[project.scripts]
ss-e2e = "e2e_portfolio.cli:main"

[tool.uv.sources]
ss-indicators = { workspace = true }
ss-macro = { workspace = true }
ss-portfolio = { workspace = true }
ss-loaders = { workspace = true }
