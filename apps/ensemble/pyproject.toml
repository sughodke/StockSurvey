[project]
name = "ensemble"
version = "0.1.0"
requires-python = ">=3.10"
description = "Learned 2-leg (DCA + vol_v3) blend. Production deployment orchestrator. Recipe weights learned via mean-variance on the joint (DCA daily, vol_v3 daily-aligned) return stream — see findings/learned-ensemble-beats-deterministic.md."
dependencies = [
    "ss-portfolio[alpaca]",
    "dca",
    "vol",
    "numpy",
    "pandas",
]

[project.scripts]
ss-ensemble = "ensemble.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ensemble"]

[tool.uv.sources]
ss-portfolio = { workspace = true }
dca = { workspace = true }
vol = { workspace = true }
