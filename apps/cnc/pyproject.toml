[project]
name = "cnc"
version = "0.1.0"
requires-python = ">=3.10"
description = "Crypto-and-carry — perp funding-rate cash-and-carry basis trade."
dependencies = [
    "ss-loaders",
    "ss-portfolio",
    "numpy",
    "pandas",
    "pyarrow",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cnc"]

[project.scripts]
ss-cnc = "cnc.cli:main"

[tool.uv.sources]
ss-loaders = { workspace = true }
ss-portfolio = { workspace = true }
