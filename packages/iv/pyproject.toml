[project]
name = "ss-iv"
version = "0.1.0"
requires-python = ">=3.10"
description = "Implied-vol data loaders + short-vol PnL accounting. Shared across apps that consume options data."
dependencies = [
    "ss-features",
    "numpy",
    "pandas",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ss_iv"]

[tool.uv.sources]
ss-features = { workspace = true }
