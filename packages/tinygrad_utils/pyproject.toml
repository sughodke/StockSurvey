[project]
name = "ss-tinygrad"
version = "0.1.0"
requires-python = ">=3.10"
description = "Shared tinygrad runtime utilities — mixed precision, JIT step patterns, dtype shims. Consumed by apps/factor, apps/replay, apps/e2e_portfolio."
dependencies = [
    "tinygrad",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ss_tinygrad"]
