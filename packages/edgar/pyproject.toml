[project]
name = "ss-edgar"
version = "0.1.0"
requires-python = ">=3.10"
description = "SEC EDGAR 13F-HR filings loader. Fetches per-quarter institutional manager holdings, parses XML to per-ticker positions, persists to .edgar-cache/."
dependencies = [
    "requests",
    "numpy",
    "pandas",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ss_edgar"]
