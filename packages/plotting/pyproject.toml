[project]
name = "ss-plotting"
version = "0.1.0"
requires-python = ">=3.10"
description = "Shared matplotlib helpers: training curves, equity comparison, scalogram, indicator panels."
dependencies = [
    "matplotlib",
    "numpy",
    "pandas",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ss_plotting"]
