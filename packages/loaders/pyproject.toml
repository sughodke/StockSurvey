[project]
name = "ss-loaders"
version = "0.1.0"
requires-python = ">=3.10"
description = "Price-data loaders: Kaggle CSV matrix, Yahoo Finance, CryptoCompare, symbol lists."
dependencies = [
    "numpy",
    "pandas",
    "requests",
    "tqdm",
    "yfinance",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ss_loaders"]
