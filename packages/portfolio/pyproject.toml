[project]
name = "ss-portfolio"
version = "0.1.0"
requires-python = ">=3.10"
description = "Portfolio metrics + weights + strategies: Sharpe, CAGR, drawdown, turnover, weight capping, weights_regime CWT-divergence builder."
dependencies = [
    "numpy",
    "pandas",
    "ss-wavelets",
    "ss-indicators",
]

[project.optional-dependencies]
alpaca = ["alpaca-py>=0.30"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ss_portfolio"]
