[project]
name = "ss-portfolio"
version = "0.1.0"
requires-python = ">=3.10"
description = "JAX portfolio metrics: Sharpe, CAGR, drawdown, turnover, weight capping."
dependencies = [
    "numpy",
    "pandas",
    "jax<0.5",
    "jaxlib<0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ss_portfolio"]
