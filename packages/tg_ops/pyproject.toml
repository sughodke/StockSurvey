[project]
name = "ss-tg-ops"
version = "0.1.0"
requires-python = ">=3.10"
description = "Tinygrad layout-glue helpers shared across StockSurvey apps."
dependencies = [
    "tinygrad",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ss_tg_ops"]
