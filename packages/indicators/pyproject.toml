[project]
name = "ss-indicators"
version = "0.1.0"
requires-python = ">=3.10"
description = "Numpy technical indicators: RSI/CCI (matrix + strided), MACD, Bollinger Bands, MA, Corwin-Schultz spread, divergence."
dependencies = [
    "numpy",
    "pandas",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ss_indicators"]
